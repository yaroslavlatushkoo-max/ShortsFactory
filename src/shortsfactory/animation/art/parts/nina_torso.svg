<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 178">
  <!-- neck -->
  <path d="M40 2 L60 2 L61 20 C57 25 43 25 39 20 Z" fill="{{skin}}" stroke="{{outline}}" stroke-width="1.5"/>
  <path d="M40 16 C45 22 55 22 60 16 L61 21 C57 26 43 26 39 21 Z" fill="{{skin_shadow}}" opacity="0.8"/>
  <!-- dress bodice with sloped shoulders and a fitted waist -->
  <path d="M33 26 C22 26 12 30 2 48 L18 120 L14 148 C14 162 20 168 30 170 L70 170
           C80 168 86 162 86 148 L82 120 L98 48 C88 30 78 26 67 26 C58 32 42 32 33 26 Z"
        fill="{{shirt}}" stroke="{{outline}}" stroke-width="1.9" stroke-linejoin="round"/>
  <!-- white collar -->
  <path d="M33 26 C40 34 60 34 67 26 C66 36 58 42 50 42 C42 42 34 36 33 26 Z"
        fill="{{collar}}" stroke="{{outline}}" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M41 31 L50 40 L59 31" fill="none" stroke="{{shirt_dark}}" stroke-width="1.3" opacity="0.6"/>
  <!-- bodice shading and folds -->
  <path d="M18 58 L18 120 L14 146 C14 157 18 164 26 167 L26 78 C26 70 22 64 18 58 Z"
        fill="{{shirt_dark}}" opacity="0.28"/>
  <path d="M38 46 C41 60 41 70 39 80" fill="none" stroke="{{shirt_dark}}" stroke-width="1.3" opacity="0.5"/>
  <path d="M62 46 C59 60 59 70 61 80" fill="none" stroke="{{shirt_dark}}" stroke-width="1.3" opacity="0.5"/>
  <!-- buttons -->
  <circle cx="50" cy="54" r="2.6" fill="{{collar}}" stroke="{{outline}}" stroke-width="1"/>
  <circle cx="50" cy="68" r="2.6" fill="{{collar}}" stroke="{{outline}}" stroke-width="1"/>
  <!-- waist ribbon -->
  <path d="M18 104 C34 100 66 100 82 104 L82 116 C66 112 34 112 18 116 Z"
        fill="{{accent}}" stroke="{{outline}}" stroke-width="1.5"/>
  <path d="M74 106 C84 101 92 103 94 109 C90 116 82 117 76 113 Z"
        fill="{{accent}}" stroke="{{outline}}" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- hem band -->
  <path d="M14 150 C30 158 70 158 86 150 L86 160 C80 167 70 170 60 170 L40 170
           C30 170 20 167 14 160 Z"
        fill="{{shirt_dark}}" stroke="{{outline}}" stroke-width="1.5" opacity="0.95"/>
</svg>
