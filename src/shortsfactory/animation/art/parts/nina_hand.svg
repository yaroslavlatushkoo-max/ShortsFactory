<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 80">
  <!-- wrist -->
  <path d="M25 6 L47 6 L47 16 L25 16 Z" fill="{{skin}}" stroke="{{outline}}" stroke-width="1.4"/>
  <path d="M27 9 L45 9" stroke="{{skin_shadow}}" stroke-width="1.1" opacity="0.7"/>
  <!-- palm and fingers -->
  <path d="M25 14 C33 11 42 13 46 20 C50 27 50 38 48 48 C46 60 42 70 36 73
           C31 75 27 72 26 67 L24 52 L20 58 C17 62 12 60 11 55 C10 50 13 46 17 42
           L21 37 L22 26 C22 20 22 16 25 14 Z"
        fill="{{skin}}" stroke="{{outline}}" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- thumb -->
  <path d="M22 34 C18 38 14 44 14 49 C14 53 17 55 20 53 C22 51 23 46 26 43 Z"
        fill="{{skin}}" stroke="{{outline}}" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- finger grooves -->
  <path d="M32 40 C33 48 34 58 34 66" fill="none" stroke="{{skin_shadow}}" stroke-width="1.2"/>
  <path d="M39 38 C40 46 41 55 40 62" fill="none" stroke="{{skin_shadow}}" stroke-width="1.2"/>
  <path d="M45 34 C46 42 46 48 45 54" fill="none" stroke="{{skin_shadow}}" stroke-width="1.1"/>
  <!-- palm highlight -->
  <path d="M28 20 C34 18 40 20 42 25 C37 23 32 23 28 26 Z" fill="{{skin_light}}" opacity="0.6"/>
</svg>
