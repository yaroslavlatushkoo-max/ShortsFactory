[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortsfactory"
version = "1.0.0"
description = "ShortsFactory: генерация коротких блочных мультфильмов (тема → история → видео)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary/CC0 assets" }
dependencies = [
    "numpy",
    "Pillow",
    "requests",
    "piper-tts",
]

[project.optional-dependencies]
desktop = ["pyinstaller"]
dev = ["pytest", "ruff"]

[project.scripts]
shortsfactory = "shortsfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: тесты, которые запускают реальный Blender-рендер (медленные)",
    "slow: медленные тесты (полный smoke/рендер)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",
    # массовые шумные, не влияют на корректность
    "F403", "F405", "E701", "E702", "B905", "B007", "B023",
    "E731", "E741", "B024",
]
# typer default-argument pattern is idiomatic for the CLI; keep it.
per-file-ignores = { "Animation_Intelligence_Lab/src/animation_lab/cli.py" = ["B008"] }
